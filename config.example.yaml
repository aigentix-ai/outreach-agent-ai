offer:
  name: AI Receptionist
  description: AI receptionist answering calls and booking appointments.
  sender_name: Ahmad
  cta: Open to a quick 10-minute chat this week?
target:
  countries:
  - United States
  industries:
  - plumber
  - HVAC
  - dentist
  max_search_results_per_query: 20
  cities: []
discovery:
  sources:
    duckduckgo: true
    meta_ads: true
    csv_import: false
    social_radar: false
  csv_path: leads_input.csv
  meta:
    access_token: ''
signals:
- name: hiring_receptionist
  query_patterns:
  - '"hiring receptionist" {industry}'
  - '"front desk" hiring {industry}'
  score: 35
- name: unanswered_calls
  query_patterns:
  - '"no one answers" {industry}'
  - '"never answers the phone" {industry}'
  score: 45
- name: appointment_friction
  query_patterns:
  - '"call to schedule" {industry}'
  score: 15
filters:
  blacklist_keywords:
  - crypto
  - casino
  blacklist_domains:
  - example.com
  - competitor.com
  excluded_industries: []
  emergency_stop: false
channels:
  active_channel: default_gmail
  accounts:
    default_gmail:
      type: gmail
      credentials_file: credentials.json
      token_file: token.json
      daily_cap: 25
      sender_name: Ahmad
    secondary_gmail:
      type: gmail
      credentials_file: credentials_secondary.json
      token_file: token_secondary.json
      daily_cap: 50
      sender_name: Sales Team
outreach:
  send_mode: draft
  daily_cap: 25
  delay_seconds: 1.0
  include_opt_out: true
  subject_template: Quick question about {company}
qualification:
  min_score: 50
  require_public_email: true
contact_intelligence:
  enabled: true
  max_search_results: 6
  min_confidence: 45
ai:
  enabled: true
  provider_order:
  - nvidia
  - openrouter
  - gemini
  min_heuristic_score_before_ai: 15
  min_confidence: 55
  max_email_words: 90
crawler:
  timeout_seconds: 12
  max_pages_per_domain: 7
  user_agent: Mozilla/5.0 (compatible; OutreachResearchBot/1.0)
theme: dark
